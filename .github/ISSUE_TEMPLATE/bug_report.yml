name: Bug report
description: Tell us about a problem with Ballest Practice Mode.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! You don't need to know anything technical.
        Just describe what happened as best you can.

  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: Describe the problem in your own words.
      placeholder: "Example: When I try to restart at my practice point, I go back to the beginning of the track."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: When did it happen?
      options:
        - Installing or opening the mod
        - In the Mods or Practice Mode menu
        - Setting a practice point
        - Restarting or respawning
        - Using the practice HUD
        - Something else / not sure
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: What were you doing when it happened?
      description: If you remember, explain what you clicked or did before the problem.
      placeholder: "Example: I started Practice Mode, saved a point, then pressed restart."
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "Example: I expected to restart at the point I saved."
    validations:
      required: false

  - type: dropdown
    id: frequency
    attributes:
      label: Does this happen every time?
      options:
        - Every time
        - Sometimes
        - Only happened once
        - Not sure
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Practice Mode version (if you know it)
      description: For example, v1.0.2. Leave this blank if you aren't sure.
      placeholder: "Not sure"
    validations:
      required: false

  - type: textarea
    id: media
    attributes:
      label: Screenshot or video (optional)
      description: You can paste or drag a screenshot or short video here. Don't include personal information.
    validations:
      required: false
